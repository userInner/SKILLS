name: Update Skill ranking

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-skill-ranking
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      - name: Test indexer
        run: python3 -m unittest scripts/test_update_skill_ranking.py

      - name: Refresh GitHub Skill sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_skill_ranking.py

      - name: Commit generated ranking
        run: |
          if git diff --quiet -- catalog.json RANKING.md README.md; then
            echo "No ranking changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json RANKING.md README.md
          git commit -m "chore: update Skill source ranking"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
