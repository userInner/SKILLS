name: Validate concrete Skills

on:
  pull_request:
    paths:
      - "community-skills/**"
      - "skills/**"
      - "scripts/extract_community_skills.py"
      - "scripts/validate_community_skills.py"
      - "scripts/test_extract_community_skills.py"
      - "scripts/test_validate_community_skills.py"
      - "scripts/build_registry_v1.py"
      - "scripts/test_build_registry_v1.py"
      - "scripts/test_workflow_policy.py"
      - "schemas/v1/**"
      - "registry/v1/**"
      - ".github/workflows/update-skill-ranking.yml"
      - ".github/workflows/validate-community-skills.yml"
  push:
    branches:
      - master
    paths:
      - "community-skills/**"
      - "skills/**"
      - "scripts/extract_community_skills.py"
      - "scripts/validate_community_skills.py"
      - "scripts/test_extract_community_skills.py"
      - "scripts/test_validate_community_skills.py"
      - "scripts/build_registry_v1.py"
      - "scripts/test_build_registry_v1.py"
      - "scripts/test_workflow_policy.py"
      - "schemas/v1/**"
      - "registry/v1/**"
      - ".github/workflows/update-skill-ranking.yml"
      - ".github/workflows/validate-community-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test extraction and validation rules
        run: >-
          python3 -m unittest
          scripts/test_update_skill_ranking.py
          scripts/test_extract_community_skills.py
          scripts/test_validate_community_skills.py
          scripts/test_build_registry_v1.py
          scripts/test_workflow_policy.py
      - name: Validate concrete Skill packages
        run: python3 scripts/validate_community_skills.py
      - name: Verify deterministic registry v1
        run: python3 scripts/build_registry_v1.py --check
