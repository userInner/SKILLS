name: Extract community Skills

on:
  workflow_run:
    workflows:
      - Update Skill ranking
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: extract-community-skills
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UPDATE_BRANCH: automation/community-skills
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Test extraction rules
        run: python3 -m unittest scripts/test_extract_community_skills.py scripts/test_validate_community_skills.py

      - name: Extract concrete Skill packages
        run: python3 scripts/extract_community_skills.py

      - name: Validate generated packages
        run: python3 scripts/validate_community_skills.py

      - name: Detect candidate changes
        id: changes
        run: |
          if git diff --quiet -- README.md community-skills; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No concrete Skill changes"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_branch="${{ github.event.repository.default_branch }}"
          concrete_count="$(jq -r '.concreteSkillCount' community-skills/index.json)"
          extracted_count="$(jq -r '.extractedSkillCount' community-skills/index.json)"
          review_count="$(jq -r '.needsReviewCount' community-skills/index.json)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add README.md community-skills
          git commit -m "chore: refresh concrete community Skills"

          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
          fi
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --base "$base_branch" --state open --json number --jq '.[0].number // empty')"
          body="$(printf '%s\n\n%s\n\n%s\n%s\n%s\n\n%s' \
            'GitHub 自动提取任务生成的候选更新。此 PR 不会自动合并。' \
            '本次索引：' \
            "- 具体 Skill：$concrete_count" \
            "- 已提取待验收：$extracted_count" \
            "- 待安全审查：$review_count" \
            '已执行提取规则测试、索引校验和包完整性校验。请人工查看变化后再合并。')"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --repo "$GITHUB_REPOSITORY" --title "chore: refresh concrete community Skills" --body "$body"
            echo "Updated PR #$existing_pr"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$base_branch" --head "$UPDATE_BRANCH" --title "chore: refresh concrete community Skills" --body "$body"
          fi
